<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Load the Google Maps JavaScript API dynamically
    function initGoogleMapsScript() {
      fetch('/api/google-maps-key')
        .then(response => response.json())
        .then(data => {
          if (data.key) {
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${data.key}&libraries=places&callback=Function.prototype`;
            script.async = true;
            script.defer = true;
            document.head.appendChild(script);
            
            // Store the API key in window.ENV
            window.ENV = {
              GOOGLE_MAPS_API_KEY: data.key
            };
          }
        })
        .catch(err => {
          console.error('Failed to load Google Maps API:', err);
        });
    }
    
    // Call the function when the page loads
    window.addEventListener('load', initGoogleMapsScript);
  </script>
